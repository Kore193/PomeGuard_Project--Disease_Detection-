<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History - PomoGuard</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* Styles for the history page */
        body {
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
        }
        h2 {
            text-align: center;
            color: #218838;
            margin-bottom: 25px;
        }
        #history-loader {
            text-align: center;
            padding: 30px;
            font-size: 1.2em;
        }
        #history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #history-table th, #history-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        #history-table th {
            background-color: #f7f9fc;
            color: #333;
        }
        #history-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .no-history {
            text-align: center;
            font-size: 1.1em;
            color: #777;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Your Prediction History</h2>
        
      <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="Home.html" style="text-decoration: none;">
                <button style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
                    &larr; Back to Home
                </button>
            </a>
                <button id="delete-history-btn" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 8px; cursor: pointer;">
                Delete All History
                 </button>
        </div>
        <div id="history-container">
            <div id="history-loader">Loading your history...</div>
        </div>

    </div>

    <script src="history_logic.js"></script>

</body>
</html>
