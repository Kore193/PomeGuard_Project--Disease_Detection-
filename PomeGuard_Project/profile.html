<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomeGuard - Farmer Profile</title>
    <style>
        :root {
            --bg-dark: #070B16;
            --bg-card: rgba(18, 24, 38, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-white: #f8fafc;
            --text-gray: #9ca3af;
            --green-primary: #16a34a;
            --red-alert: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(22, 163, 74, 0.05) 0%, transparent 50%);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 900px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 30px;
            transition: color 0.3s;
        }
        .back-btn:hover { color: var(--green-primary); }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(12px);
        }

        .profile-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; margin-bottom: 20px; }
        .profile-title h2 { font-size: 26px; font-weight: 800; color: var(--green-primary); }

        /* Modified Grid: 2 clean columns instead of 3 */
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .info-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-gray); margin-bottom: 6px; }
        .info-group p { font-size: 16px; font-weight: 600; color: var(--text-white); }

        /* --- History Table UI --- */
        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(12px);
        }

        .history-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-white); }

        .table-responsive { width: 100%; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 14px; border-bottom: 2px solid var(--border-glass); color: var(--text-gray); font-size: 13px; text-transform: uppercase; font-weight: 700; }
        td { padding: 14px; border-bottom: 1px solid var(--border-glass); color: #cbd5e1; font-size: 14px; }
        
        tr:hover td { background: rgba(255,255,255,0.02); }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-disease { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        .badge-healthy { background: rgba(22, 163, 74, 0.1); color: #4ade80; }

        .delete-btn {
            background: none;
            border: none;
            color: var(--red-alert);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .delete-btn:hover { opacity: 0.8; text-decoration: underline; }
        
        #noHistoryMsg { text-align: center; color: var(--text-gray); padding: 30px 20px; font-size: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="home.html" class="back-btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>

        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-title">
                    <h2 id="profUsername">Loading Farmer Profile...</h2>
                </div>
            </div>
            <div class="profile-grid">
                <div class="info-group">
                    <label>Registered Email</label>
                    <p id="profEmail">-</p>
                </div>
                <div class="info-group">
                    <label>Contact Phone</label>
                    <p id="profPhone">-</p>
                </div>
            </div>
        </div>

        <div class="history-card">
            <h3>Recent Diagnostic Scan Logs</h3>
            <div class="table-responsive">
                <table id="historyTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Disease ID</th>
                            <th>Pathogen Name</th>
                            <th>Date Explored</th>
                            <th>Accuracy Check</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        </tbody>
                </table>
                <div id="noHistoryMsg">Loading history logs...</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('pomoGuardToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('profUsername').innerText = payload.sub;
            } catch(e) { console.error(e); }

            await fetchUserProfileAndHistory(token);
        });

        async function fetchUserProfileAndHistory(token) {
            try {
                const response = await fetch('http://127.0.0.1:8001/user/profile', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error("Could not download metrics");
                const data = await response.json();

                document.getElementById('profEmail').innerText = data.user.email || 'N/A';
                document.getElementById('profPhone').innerText = data.user.phone_number || 'N/A';

                const tbody = document.getElementById('historyTableBody');
                const table = document.getElementById('historyTable');
                const noHistoryMsg = document.getElementById('noHistoryMsg');
                
                tbody.innerHTML = '';
                
                if (!data.history || data.history.length === 0) {
                    noHistoryMsg.innerText = "No scan history logs recorded yet.";
                    noHistoryMsg.style.display = 'block';
                    table.style.display = 'none';
                    return;
                }

                noHistoryMsg.style.display = 'none';
                table.style.display = 'table';

                data.history.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.id = `scan-row-${row.scan_id}`;
                    
                    const isHealthy = row.disease_name === 'Healthy';
                    const badgeClass = isHealthy ? 'badge-healthy' : 'badge-disease';
                    
                    // Safe date parsing fallbacks
                    let dateStr = "Recent";
                    if (row.scan_date) {
                        const parsedDate = new Date(row.scan_date);
                        if (!isNaN(parsedDate)) {
                            dateStr = parsedDate.toLocaleDateString('en-US', {
                                year: 'numeric', month: 'short', day: 'numeric'
                            });
                        }
                    }

                    // Handles string or float percentage safely
                    let confidenceVal = parseFloat(row.confidence);
                    if (confidenceVal <= 1.0) confidenceVal = confidenceVal * 100;
                    if (isNaN(confidenceVal)) confidenceVal = 0.00;

                    tr.innerHTML = `
                        <td><strong>#${row.disease_id || row.disease_name.substring(0,3).toUpperCase()}</strong></td>
                        <td><span class="badge ${badgeClass}">${row.disease_name}</span></td>
                        <td>${dateStr}</td>
                        <td style="color: var(--green-primary); font-weight: bold;">${confidenceVal.toFixed(2)}%</td>
                        <td><button class="delete-btn" onclick="deleteHistoryRecord(${row.scan_id})">Delete</button></td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('noHistoryMsg').innerText = "⚠️ Failed to fetch history log fields from server.";
            }
        }

        // Global scope placeholder tracking for targeted deletion operations
let activeDeletionId = null;

function deleteHistoryRecord(scanId) {
    activeDeletionId = scanId;
    
    const modal = document.getElementById('customConfirmModal');
    if (modal) {
        modal.style.display = 'flex';
        // Add entry animation transition clip subtly
        setTimeout(() => { modal.firstElementChild.style.transform = 'scale(1)'; }, 10);
    }
}

// Attach event listeners when DOM loads up seamlessly
document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('customConfirmModal');
    const cancelBtn = document.getElementById('modalCancelBtn');
    const confirmBtn = document.getElementById('modalConfirmBtn');

    const closeModal = () => {
        if (modal) {
            modal.firstElementChild.style.transform = 'scale(0.95)';
            setTimeout(() => { modal.style.display = 'none'; }, 150);
        }
        activeDeletionId = null;
    };

    cancelBtn?.addEventListener('click', closeModal);
    
    // Close modal if user clicks outside on the darkened overlay blur zone background
    modal?.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    confirmBtn?.addEventListener('click', async () => {
        if (!activeDeletionId) return;
        const token = localStorage.getItem('pomoGuardToken');

        try {
            const response = await fetch(`http://127.0.0.1:8001/history/delete/${activeDeletionId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const data = await response.json();

            if (response.ok) {
                // Remove the row row line visually right away
                document.getElementById(`scan-row-${activeDeletionId}`)?.remove();
                
                // Manage dynamic table clean tracking states
                const tbody = document.getElementById('historyTableBody');
                if (tbody && tbody.children.length === 0) {
                    const noHist = document.getElementById('noHistoryMsg');
                    const table = document.getElementById('historyTable');
                    if (noHist) {
                        noHist.innerText = "No scan history logs recorded yet.";
                        noHist.style.display = 'block';
                    }
                    if (table) table.style.display = 'none';
                }
            } else {
                alert(`⚠️ Error: ${data.detail || 'Failed to drop row parameters.'}`);
            }
        } catch (err) {
            console.error("Ledger drop execution exception mapping:", err);
        } finally {
            closeModal();
        }
    });
});
    </script>
    <div id="customConfirmModal" style="display: none; position: fixed; inset: 0; background: rgba(7, 11, 22, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: #121826; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; width: 90%; max-width: 400px; padding: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); transform: scale(0.95); transition: transform 0.2s ease;">
        
        <div style="width: 50px; height: 50px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>

        <h4 style="font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 8px;">Delete Scan Record?</h4>
        <p style="font-size: 14px; color: #9ca3af; line-height: 1.5; margin-bottom: 24px;">Are you sure you want to permanently delete this scan record? This action cannot be undone.</p>
        
        <div style="display: flex; gap: 12px; justify-content: center;">
            <button id="modalCancelBtn" style="flex: 1; padding: 10px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; color: #cbd5e1; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s;">Cancel</button>
            <button id="modalConfirmBtn" style="flex: 1; padding: 10px 16px; background: #ef4444; border: none; border-radius: 30px; color: white; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s;">Delete</button>
        </div>
    </div>
</div>
</body>
</html>
