<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pomegranate Disease Solutions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: url('pomegranate.jpg') no-repeat center center / cover;
      min-height: 100vh;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: white;
      margin-bottom: 40px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      flex-direction: row;
    }

    .disease-button {
      padding: 12px 24px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .disease-button:hover {
      background-color: black;
    }

    .anchor {
      scroll-margin-top: 100px;
    }
  </style>
</head>
<body>

  <h1>Pomegranate Disease Solutions</h1>

  <div class="button-row">
    <a href="alternaria.html" class="disease-button">बुरशी (Alternaria)</a>
    <a href="Anthronous.html" class="disease-button">खरडा (Anthracnose)</a>
    <a href="Bacterial-blight.html" class="disease-button">तेल्या (Bacterial Blight)</a>
    <a href="cercospora.html" class="disease-button">डांबरी (Cercospora)</a>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const hash = window.location.hash;
      if (hash) {
        const el = document.querySelector(hash);
        if (el) {
          el.scrollIntoView({ behavior: "smooth" });
          el.style.backgroundColor = "#ffe6f0";
          setTimeout(() => {
            el.style.backgroundColor = "";
          }, 2000);
        }
      }
    });
  </script>

</body>
</html>
